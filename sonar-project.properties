sonar.projectName=HelpRadar
sonar.organization=danil5250
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,\
  frontend/app.vue,frontend/assets/css,frontend/components,frontend/composables,frontend/data,\
  frontend/layouts,frontend/locales,frontend/middleware,frontend/pages,frontend/plugins,\
  frontend/server,frontend/types,frontend/utils,\
  mobile/app/src/main
sonar.tests=backend/src,backend/test,frontend/test,mobile/app/src/test,mobile/app/src/androidTest
sonar.exclusions=**/*.d.ts,backend/src/**/*.spec.ts
sonar.test.inclusions=backend/src/**/*.spec.ts,backend/test/**/*,frontend/test/**/*,\
  mobile/app/src/test/**/*,mobile/app/src/androidTest/**/*

sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.sonar.json
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=mobile/app/build/reports/coverage/test/debug/report.xml

# .vue files are templates only; their logic is tested in utils.
sonar.coverage.exclusions=backend/src/main.ts,backend/src/**/*.module.ts,backend/src/**/*.entity.ts,\
  backend/src/migrations/**,\
  frontend/**/*.vue
