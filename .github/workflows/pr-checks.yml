name: Backend PR checks

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Keep the target branches' SonarQube baselines current.
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: backend

env:
  NODE_ENV: test
  CI: 'true'
  TZ: UTC
  APP_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173
  MAIL_DRIVER: memory
  DISABLE_SCHEDULER: 'true'
  BCRYPT_ROUNDS: '4'
  FILE_URL_SECRET: ci-only-file-signing-secret
  # Integration tests override storage and geocoding providers; no cloud keys needed.
  AWS_EC2_METADATA_DISABLED: 'true'
  GEOCODER_BASE_URL: http://127.0.0.1:9

jobs:
  lint:
    name: Backend lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint:eslint
      - name: Existing type-aware Oxlint checks
        run: npm run lint
      - name: Prettier (check only)
        run: npm run format:check

  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:typecheck
      - run: npm run test:ci -- --coverage
      - name: Verify LCOV report
        run: test -s coverage/lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-unit-coverage
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: error

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d helpradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: helpradar_test
      DB_SSL: 'false'
      DB_MIGRATIONS_RUN: 'true'
      ALLOW_REMOTE_DB: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Fixture creates an isolated database, runs migrations, then drops it.
      - run: npm run test:integration
      - name: PostgreSQL diagnostics
        if: failure()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: docker logs "$POSTGRES_CONTAINER_ID"

  sonar:
    name: Backend SonarQube quality gate
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: backend-unit-coverage
          path: backend/coverage
      - name: Verify SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Configure SONAR_TOKEN, SONAR_HOST_URL and SONAR_PROJECT_KEY. Fork and bot PRs require a trusted analysis policy; scanning cannot be silently skipped."
            exit 1
          fi
          test -s coverage/lcov.info
      # No npm installation or PR-provided lifecycle scripts in this secret-bearing job.
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  gate:
    name: Backend CI gate
    needs: [lint, unit, integration, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every stage to succeed
        working-directory: .
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          printf 'lint=%s unit=%s integration=%s sonar=%s\n' \
            "$LINT_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$SONAR_RESULT"
          [[ "$LINT_RESULT" == success && "$UNIT_RESULT" == success &&
             "$INTEGRATION_RESULT" == success && "$SONAR_RESULT" == success ]]
